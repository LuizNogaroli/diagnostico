        .wizard-step { display: none; }
        .wizard-step.active { display: block; }
        
        .search-container {
            background: #e9ecef;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }
        
        .stepper-menu a {
            cursor: pointer;
            transition: all 0.3s;
        }
        .stepper-menu a.completed { background: #28a745 !important; color: white !important; }
        .stepper-menu a.active-step { box-shadow: 0 0 0 4px rgba(0,86,179,0.3); }
        
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 2px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            right: 30px;
            bottom: 30px;
            font-size: 17px;
        }
        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>

    <script src="scripts.js?v=20260824a"></script>
    <script>
        let map = null;
        let drawnItems = null;
        let drawControl = null;

        function abrirMapa() {
            const modal = document.getElementById('modal-mapa');
            modal.style.display = 'flex';

            const mapContainer = document.getElementById('map-container');
            if (typeof L === 'undefined') {
                mapContainer.innerHTML = '<div style="padding: 40px; text-align:center;"><div style="color:#dc2626; font-weight:bold; font-size:15px;">Erro: biblioteca Leaflet não carregou.</div><div style="font-size:13px; color:#64748b; margin-top:8px;">Pressione Ctrl+F5 para recarregar sem cache e tente novamente.</div></div>';
                return;
            }
            if (typeof L.Control === 'undefined' || typeof L.Control.Draw === 'undefined') {
                mapContainer.innerHTML = '<div style="padding: 40px; text-align:center;"><div style="color:#dc2626; font-weight:bold; font-size:15px;">Erro: Leaflet Draw não carregou.</div><div style="font-size:13px; color:#64748b; margin-top:8px;">Pressione Ctrl+F5 para recarregar sem cache e tente novamente.</div></div>';
                return;
            }

            const lat = parseFloat(document.getElementById('coordenadas_lat').value) || -15.794167;
            const lon = parseFloat(document.getElementById('coordenadas_lon').value) || -47.8825;

            if (!map) {
                map = L.map('map-container').setView([lat, lon], 15);
                const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap',
                    maxZoom: 19
                });
                tiles.addTo(map);
                // Fallback caso os tiles do OSM estejam bloqueados na rede
                let fallbackAdded = false;
                tiles.on('tileerror', function() {
                    if (fallbackAdded) return;
                    fallbackAdded = true;
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                        attribution: '&copy; OpenStreetMap &copy; CARTO',
                        maxZoom: 19
                    }).addTo(map);
                });

                drawnItems = new L.FeatureGroup();
                map.addLayer(drawnItems);

                drawControl = new L.Control.Draw({
                    draw: {
                        polyline: false,
                        rectangle: false,
                        circle: false,
                        circlemarker: { radius: 8 },
                        marker: true,
                        polygon: {
                            allowIntersection: false,
                            shapeOptions: { color: '#0056b3', weight: 2 }
                        }
                    },
                    edit: { featureGroup: drawnItems, remove: true }
                });
                map.addControl(drawControl);

                map.on(L.Draw.Event.CREATED, function(e) {
                    drawnItems.addLayer(e.layer);
                });

                // Garante o redimensionamento correto dentro do modal recém-aberto
                setTimeout(function() { map.invalidateSize(); }, 200);
            } else {
                map.setView([lat, lon], 15);
                map.invalidateSize();
            }

            // Se já tem coordenadas salvas, tenta recriar no mapa
            const latVal = document.getElementById('coordenadas_lat').value;
            const lonVal = document.getElementById('coordenadas_lon').value;
            if (latVal && lonVal) {
                drawnItems.clearLayers();
                L.marker([parseFloat(latVal), parseFloat(lonVal)]).addTo(drawnItems);
                map.setView([parseFloat(latVal), parseFloat(lonVal)], 15);
            }
        }

        function fecharMapa() {
            document.getElementById('modal-mapa').style.display = 'none';
        }

        function limparMapa() {
            if (drawnItems) drawnItems.clearLayers();
        }

        function salvarMapa() {
            const layers = drawnItems.getLayers();
            if (layers.length === 0) {
                alert('Desenhe um polígono ou marque um ponto antes de salvar.');
                return;
            }

            const layer = layers[0];
            let coordenadas = '';

            if (layer instanceof L.Marker) {
                const ll = layer.getLatLng();
                document.getElementById('coordenadas_lat').value = ll.lat.toFixed(6);
                document.getElementById('coordenadas_lon').value = ll.lng.toFixed(6);
                coordenadas = ll.lat.toFixed(6) + ', ' + ll.lng.toFixed(6);
            } else if (layer instanceof L.Polygon) {
                const latlngs = layer.getLatLngs()[0];
                const coords = latlngs.map(ll => ll.lat.toFixed(6) + ' ' + ll.lng.toFixed(6));
                coordenadas = coords.join(', ');
                // Define o centro como lat/lon principal
                const center = layer.getBounds().getCenter();
                document.getElementById('coordenadas_lat').value = center.lat.toFixed(6);
                document.getElementById('coordenadas_lon').value = center.lng.toFixed(6);
            }

            document.getElementById('coordenadas').value = coordenadas;
            fecharMapa();
        }
    </script>
</body>
</html>
