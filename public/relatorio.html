<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Solicitações - RIP</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; color: #333; background: #f8f9fa; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #0056b3; border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-top: 0; }
        .rip-title { font-size: 20px; color: #6c757d; margin-bottom: 30px; }
        .solicitacao-card { border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .solicitacao-card h3 { margin-top: 0; color: #495057; display: flex; justify-content: space-between; }
        .badge { background: #ffc107; color: #000; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .field-row { margin-bottom: 10px; }
        .label { font-weight: bold; color: #6c757d; display: inline-block; width: 120px; }
        .value.old { text-decoration: line-through; color: #dc3545; }
        .value.new { color: #28a745; font-weight: bold; }
        .justificativa { background: #f8f9fa; padding: 15px; border-left: 4px solid #0056b3; margin-top: 15px; font-style: italic; }
        .btn-print { background: #0056b3; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-bottom: 20px; }
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .btn-print { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <button class="btn-print" onclick="window.print()">🖨️ Imprimir Relatório</button>
    
    <h1>Solicitações de Alteração ao Cadastro</h1>
    <div class="rip-title" id="rip-display">RIP: Carregando...</div>

    <div id="solicitacoes-container">
        <p>Buscando solicitações...</p>
    </div>
</div>

<script>
    const BASE_URL = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';
    const urlParams = new URLSearchParams(window.location.search);
    const rip = urlParams.get('rip');

    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    if (rip) {
        document.getElementById('rip-display').innerText = `Imóvel RIP nº ${rip}`;
        
        fetch(`${BASE_URL}/api/solicitacoes/${encodeURIComponent(rip)}`)
            .then(res => res.json())
            .then(result => {
                const container = document.getElementById('solicitacoes-container');
                container.innerHTML = '';
                
                if (result.success && result.data.length > 0) {
                    result.data.forEach(sol => {
                        const date = new Date(sol.data_hora).toLocaleString('pt-BR');
                        const isNota = !sol.valor_atual;
                        let arquivosHtml = '';
                        if (sol.arquivos) {
                            let arr = [];
                            try { arr = JSON.parse(sol.arquivos); } catch (e) {}
                            if (arr.length > 0) {
                                const links = arr.map(fp => {
                                    const filename = fp.split(/[/\\]/).pop();
                                    const viewUrl = '/' + fp.replace(/\\/g, '/').replace(/^\/+/, '');
                                    return `<a href="${viewUrl}" target="_blank" style="padding: 4px 8px; background: #28a745; color: white; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; margin: 0 6px 6px 0; display: inline-block;">📎 ${esc(filename)}</a>`;
                                }).join('');
                                arquivosHtml = `<div class="field-row" style="margin-top: 10px;"><span class="label">Arquivos:</span> <div style="display:inline;">${links}</div></div>`;
                            }
                        }
                        const card = `
                            <div class="solicitacao-card">
                                <h3>${esc(sol.campo_nome)} <span class="badge">PENDENTE</span></h3>
                                <div class="field-row"><span class="label">Data/Hora:</span> ${esc(date)}</div>
                                ${isNota ? `
                                    <div class="justificativa" style="background: #fff8e1; border-left: 4px solid #ffc107;">
                                        <strong>Solicitação:</strong><br>
                                        ${esc(sol.novo_valor).replace(/\n/g, '<br>')}
                                    </div>
                                ` : `
                                    <div class="field-row"><span class="label">Valor Atual:</span> <span class="value old">${esc(sol.valor_atual)}</span></div>
                                    <div class="field-row"><span class="label">Novo Valor:</span> <span class="value new">${esc(sol.novo_valor)}</span></div>
                                    <div class="justificativa">
                                        <strong>Justificativa:</strong><br>
                                        ${esc(sol.justificativa).replace(/\n/g, '<br>')}
                                    </div>
                                    <div class="justificativa" style="background: #eef2f5; border-left: 4px solid #17a2b8;">
                                        <strong>Fundamentação Legal:</strong><br>
                                        ${esc(sol.fundamentacao).replace(/\n/g, '<br>')}
                                    </div>
                                `}
                                ${arquivosHtml}
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = '<p>Nenhuma solicitação de alteração encontrada para este RIP.</p>';
                }
            })
            .catch(err => {
                document.getElementById('solicitacoes-container').innerHTML = '<p style="color:red;">Erro ao buscar dados.</p>';
            });
    } else {
        document.getElementById('solicitacoes-container').innerHTML = '<p style="color:red;">RIP não especificado na URL.</p>';
    }
</script>

</body>
</html>
